owner: intk # Your GitHub username
repo: intk-upptime # Your Github repository name
sites:
  - name: Bonnefanten
    url: https://www.bonnefanten.nl
  - name: Het Markiezenhof
    url: https://www.markiezenhof.nl
  - name: INTK
    url: https://www.intk.com/en
user-agent: andreesg

workflowSchedule:
  # uptime and responseTime use Europe/Amsterdam. The template guard restores
  # their timezone after regeneration; the runtime guard handles delayed runs.
  graphs: "0 0 * * *"
  responseTime: "17 12 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "2-59/5 6-23 * * *"

status-website:
  baseUrl: /intk-upptime
  logoUrl: https://old.intk.com/logo.png
  name: INTK
  introTitle: "Monitor the uptime of INTK projects"
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
